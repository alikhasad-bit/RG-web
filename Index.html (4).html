function levenshtein(a, b) {
  a = a.toLowerCase().trim(); b = b.toLowerCase().trim();
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      dp[i][j] = Math.min(dp[i - 1][j] + 1, dp[i][j - 1] + 1, dp[i - 1][j - 1] + cost);
    }
  return dp[m][n];
}
function spellingScore(a, b) {
  if (!a || !b) return 0;
  const dist = levenshtein(a, b);
  const maxLen = Math.max(a.length, b.length) || 1;
  return Math.round((1 - dist / maxLen) * 100);
}
function soundex(s) {
  if (!s) return "";
  s = s.toUpperCase().replace(/[^A-Z]/g, "");
  if (!s) return "";
  const codes = { B: 1, F: 1, P: 1, V: 1, C: 2, G: 2, J: 2, K: 2, Q: 2, S: 2, X: 2, Z: 2, D: 3, T: 3, L: 4, M: 5, N: 5, R: 6 };
  let out = s[0]; let lastCode = codes[s[0]] || 0;
  for (let i = 1; i < s.length && out.length < 4; i++) {
    const code = codes[s[i]] || 0;
    if (code !== 0 && code !== lastCode) out += code;
    lastCode = code;
  }
  return (out + "000").slice(0, 4);
}
function combinedSimilarity(a, b) {
  const spell = spellingScore(a, b);
  const soundAlike = soundex(a) && soundex(a) === soundex(b);
  return soundAlike ? Math.max(spell, 75) : spell;
}
function bestMatchInBank(name, bankNames) {
  if (!name || !name.trim() || bankNames.length === 0) return { match: "", score: 0 };
  let best = { match: "", score: -1 };
  bankNames.forEach((b) => { const s = combinedSimilarity(name, b); if (s > best.score) best = { match: b, score: s }; });
  return best;
}

}

function fileToCompressedDataUrl(file, maxDim = 700, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new window.Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject; img.src = e.target.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

function svgBarChart(data, color) {
  const max = Math.max(1, ...data.map((d) => d.value));
  const w = 60, gap = 14, h = 130;
  const bars = data.map((d, i) => {
    const bh = Math.max(2, (d.value / max) * (h - 30));
    const x = i * (w + gap);
    return `<rect x="${x}" y="${h - bh}" width="${w}" height="${bh}" fill="${color}" rx="4" />
      <text x="${x + w / 2}" y="${h - bh - 6}" font-size="12" font-weight="700" text-anchor="middle" fill="#3A3F4B">${d.value}</text>
      <text x="${x + w / 2}" y="${h + 14}" font-size="10" text-anchor="middle" fill="#9AA5B8">${String(d.label).slice(0, 10)}</text>`;
  }).join("");
  return `<svg width="${data.length * (w + gap)}" height="${h + 24}" xmlns="http://www.w3.org/2000/svg">${bars}</svg>`;
}
function svgDonutChart(data, colors) {
  const total = data.reduce((s, d) => s + d.value, 0);
  if (total === 0) return "<div style='color:#9AA5B8;font-size:12px;'>No data</div>";
  const size = 150, r = size / 2 - 10, cx = size / 2, cy = size / 2;
  let angleStart = -90;
  const slices = data.filter((d) => d.value > 0).map((d, i) => {
    const angle = (d.value / total) * 360;
    const x1 = cx + r * Math.cos((Math.PI * angleStart) / 180), y1 = cy + r * Math.sin((Math.PI * angleStart) / 180);
    const angleEnd = angleStart + angle;
    const x2 = cx + r * Math.cos((Math.PI * angleEnd) / 180), y2 = cy + r * Math.sin((Math.PI * angleEnd) / 180);
    const largeArc = angle > 180 ? 1 : 0;
    const path = `M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArc} 1 ${x2},${y2} Z`;
    const color = colors[i % colors.length];
    angleStart = angleEnd;
    return `<path d="${path}" fill="${color}" stroke="#fff" stroke-width="2" />`;
  }).join("");
  const legend = data.filter((d) => d.value > 0).map((d, i) => `<div style="display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:4px;"><span style="width:10px;height:10px;border-radius:3px;background:${colors[i % colors.length]};display:inline-block;"></span>${d.label} (${d.value})</div>`).join("");
  return `<div style="display:flex;align-items:center;gap:16px;">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${slices}<circle cx="${cx}" cy="${cy}" r="${r * 0.55}" fill="#fff" /><text x="${cx}" y="${cy + 5}" text-anchor="middle" font-size="16" font-weight="700" fill="#1B2A4A">${total}</text></svg>
    <div>${legend}</div>
  </div>`;
}

    </table>`;
}
// Opens the report in a new tab and triggers print. If the browser's pop-up blocker
// intercepts window.open (the most common reason "Generate Report" silently did nothing),

function openReportWindow(title, bodyHtml) {
  const w = window.open("", "_blank");
  if (!w) {
    alert("Your browser blocked the report pop-up. Please allow pop-ups for this site (usually a small icon in the address bar) and click Generate Report again.");
    return;

  const generatedOn = new Date().toLocaleDateString();
  w.document.write(`
    <html><head><title>RG Pharmaceutica — ${escapeHtml(title)}</title></head>
    <body style="font-family:Arial,sans-serif;max-width:850px;margin:40px auto;color:#232833;">

    </body></html>
  `);
  w.document.close();
  setTimeout(() => { w.focus(); w.print(); }, 400);
}

  function importExcel(file, tabKey, mapRow, currentList, setList, storageKey) {
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const wb = XLSX.read(evt.target.result, { type: "binary" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        // Read as raw rows first so we can find the real header row even if there's
        // a title/blank row above it (a very common reason imports silently fail).
        const rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", blankrows: false });
        let headerRowIdx = 0;
        for (let i = 0; i < Math.min(rawRows.length, 8); i++) {
          const nonEmpty = rawRows[i].filter((c) => String(c).trim() !== "").length;
          if (nonEmpty >= 2) { headerRowIdx = i; break; }
        }
        const headerRow = rawRows[headerRowIdx].map((h) => String(h).trim());
        const dataRows = rawRows.slice(headerRowIdx + 1);
        const rows = dataRows
          .filter((r) => r.some((c) => String(c).trim() !== ""))
          .map((r) => { const obj = {}; headerRow.forEach((h, i) => { if (h) obj[h] = r[i] !== undefined ? r[i] : ""; }); return obj; });
        const sheetId = uid("sheet");
        const imported = rows.map((row, i) => {
          const get = (...keys) => {
            const headers = Object.keys(row);
            for (const k of keys) {
              const kNorm = k.toLowerCase().trim();
              let found = headers.find((rk) => rk.toLowerCase().trim() === kNorm);
              if (!found) found = headers.find((rk) => { const rkNorm = rk.toLowerCase().trim(); return rkNorm.includes(kNorm) || kNorm.includes(rkNorm); });
              if (found && String(row[found]).trim() !== "") return row[found];
            }
            return "";
          };
          const getStatus = (list, fallback) => {
            const raw = String(get("status") || "").toLowerCase().trim();
            if (!raw) return fallback;
            const exact = list.find((s) => s.toLowerCase() === raw);
            if (exact) return exact;
            const partial = list.find((s) => raw.includes(s.toLowerCase()) || s.toLowerCase().includes(raw));
            return partial || fallback;
          };
          return { ...mapRow(get, i, getStatus), id: uid("row"), sheetId };
        });
        const updated = [...imported, ...currentList];
        setList(updated); persist(storageKey, updated);
        const sheetMeta = { id: sheetId, name: file.name, tab: tabKey, uploadedAt: today(), rowCount: imported.length };
        const updatedSheets = [sheetMeta, ...sheets];
        setSheets(updatedSheets); persist(STORAGE_KEYS.sheets, updatedSheets);
        setImportMsg((m) => ({ ...m, [tabKey]: `Imported ${imported.length} row(s) from ${file.name}. Columns detected: ${headerRow.filter(Boolean).join(", ") || "(none found)"}` }));
      } catch (err) {
        setImportMsg((m) => ({ ...m, [tabKey]: "Could not read this file — check it's a valid .xlsx/.csv with a header row." }));
      }
    };
    reader.readAsBinaryString(file);
  }

  // ---------- Generic Opposition table CRUD (used by all 4: TM by/against, Copyright by/against) ----------
  function makeOppCrud(list, setList, storageKey, extra) {

      rgpStatus: "", rgpBrandName: "", rgpIdNo: "", rgpDate: "", rgpMarketed: "", rgpSalePercentage: "", rgpMarketedDate: "",

    const add = (form) => {
      const entry = { id: uid("opp"), sheetId: null, ...form };
      const updated = [entry, ...list]; setList(updated); persist(storageKey, updated);
    };
    const update = (id, field, value) => { const updated = list.map((r) => r.id === id ? { ...r, [field]: value } : r); setList(updated); persist(storageKey, updated); };

    return { blank, add, update, remove };
  }

  // ---------- Decision to Oppose TM / Copyright (complaint-linked, with resolve sync) ----------
  function makeDecisionCrud(list, setList, storageKey, onFileInIpo) {
    const update = (id, field, value) => {
      const updated = list.map((d) => d.id === id ? { ...d, [field]: value } : d);
      setList(updated); persist(storageKey, updated);
      if (field === "caseStatus") {
        const row = updated.find((d) => d.id === id);
        if (row && row.complaintId) {
          const isTerminal = TERMINAL_CASE_STATUSES.includes(value);
          const updatedComplaints = complaints.map((c) => c.id === row.complaintId ? { ...c, resolved: isTerminal, resolvedDate: isTerminal ? today() : "" } : c);
          setComplaints(updatedComplaints); persist(STORAGE_KEYS.complaints, updatedComplaints);
        }
      }
    };
    const toggleTag = (id, tag) => {
      const row = list.find((d) => d.id === id); if (!row) return;
      const has = row.decision.includes(tag);
      const newTags = has ? row.decision.filter((t) => t !== tag) : [...row.decision, tag];
      update(id, "decision", newTags);
      if (!has && tag === "Filed in IPO (Opposition)" && onFileInIpo) onFileInIpo(row);

function DonutChart({ data, colors, size = 150 }) {
  const total = data.reduce((s, d) => s + d.value, 0);
  if (total === 0) return <EmptyState text="No data yet." />;
  const r = size / 2 - 14, cx = size / 2, cy = size / 2;
  let angleStart = -90;
  const slices = data.filter((d) => d.value > 0).map((d, i) => {
    const angle = (d.value / total) * 360;
    const x1 = cx + r * Math.cos((Math.PI * angleStart) / 180), y1 = cy + r * Math.sin((Math.PI * angleStart) / 180);
    const angleEnd = angleStart + angle;
    const x2 = cx + r * Math.cos((Math.PI * angleEnd) / 180), y2 = cy + r * Math.sin((Math.PI * angleEnd) / 180);
    const largeArc = angle > 180 ? 1 : 0;
    const path = `M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${largeArc} 1 ${x2},${y2} Z`;
    const color = colors[i % colors.length];
    angleStart = angleEnd;
    return { path, color, label: d.label, value: d.value };
  });
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 20, flexWrap: "wrap" }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        {slices.map((s, i) => <path key={i} d={s.path} fill={s.color} stroke="#fff" strokeWidth="2" />)}
        <circle cx={cx} cy={cy} r={r * 0.55} fill="#fff" />
        <text x={cx} y={cy + 5} textAnchor="middle" fontSize="16" fontWeight="700" fill="#1B2A4A">{total}</text>
      </svg>
      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
        {slices.map((s, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11.5 }}>
            <span style={{ width: 10, height: 10, borderRadius: 3, background: s.color, display: "inline-block" }} />
            <span style={{ color: "#3A3F4B" }}>{s.label}</span><span style={{ color: "#9AA5B8" }}>({s.value})</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function BarChart({ data, color, height = 140 }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height, padding: "8px 4px 0" }}>
      {data.map((d) => (
        <div key={d.label} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", minWidth: 0 }}>
          <div style={{ fontSize: 10.5, fontWeight: 700, color: "#3A3F4B" }}>{d.value}</div>
          <div style={{ width: "70%", background: color, borderRadius: "4px 4px 0 0", height: Math.max(3, (d.value / max) * (height - 30)), transition: "height 0.3s" }} />
          <div style={{ fontSize: 9.5, color: "#9AA5B8", marginTop: 4, textAlign: "center", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", width: "100%" }} title={d.label}>{d.label}</div>
        </div>
      ))}
    </div>
  );
}

function StatGroup({ title, children, color, onClick }) {
  return <div style={{ marginBottom: 14 }}><div style={{ ...styles.statGroupTitle, color: color || "#3A3F4B", cursor: onClick ? "pointer" : "default" }} onClick={onClick}>{title} {onClick && "→"}</div><div style={styles.statRowSmall}>{children}</div></div>;
}

function downloadTemplate(columns, filename) {
  const ws = XLSX.utils.aoa_to_sheet([columns]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Template");
  XLSX.writeFile(wb, filename);
}

// Exports the CURRENT data of a tab to Excel — columns is [{header, get: (row) => value}]
function exportToExcel(rows, columns, filename) {
  const data = rows.map((r) => {
    const obj = {};
    columns.forEach((c) => { obj[c.header] = c.get(r); });
    return obj;
  });
  const ws = XLSX.utils.json_to_sheet(data.length > 0 ? data : [Object.fromEntries(columns.map((c) => [c.header, ""]))]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Data");
  XLSX.writeFile(wb, filename);
}

function ExcelUploadRow({ fileInputRef, onExcel, importMsg, hint, templateColumns, templateName, exportRows, exportColumns, exportName }) {
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginBottom: 6, flexWrap: "wrap" }}>
        {exportColumns && <button style={{ ...styles.uploadBtn, background: "#2E6F6E" }} onClick={() => exportToExcel(exportRows || [], exportColumns, exportName || "export.xlsx")}>⬆ Export to Excel ({(exportRows || []).length})</button>}
        {templateColumns && <button style={{ ...styles.uploadBtn, background: "#6B7280" }} onClick={() => downloadTemplate(templateColumns, templateName || "template.xlsx")}>⬇ Download Template</button>}
        <input type="file" accept=".xlsx,.xls,.csv" ref={fileInputRef} style={{ display: "none" }} onChange={onExcel} />
        <button style={styles.uploadBtn} onClick={() => fileInputRef.current.click()}><Upload size={14} /> Upload Excel</button>
      </div>
      {importMsg && <div style={styles.importMsg}>{importMsg}</div>}
      <div style={{ fontSize: 11, color: "#9AA5B8", marginBottom: 14 }}>{hint}</div>
    </div>
  );
}

// ---------- Reusable Opposition Record Card (used by TM by/against RGP and Copyright by/against RGP) ----------
const RGP_STATUS_OPTIONS = ["Applied", "Advertised", "Certified", "DRAP Enlisted/Registered"];

function rgpSourceList(items, mode) {
  // items = trademarks or copyrights; returns [{value: statusOption, list: filteredNames}]
  return items;
}

function OppRecordCard({ row, crud, mode, statusOptions, showNiceClass, sourceItems }) {
  const idLabel = mode === "tm" ? "TM No." : "Copyright No.";
  const nameLabel = mode === "tm" ? "Brand Name of RGP" : "Copyright Name of RGP";
  const otherNameLabel = mode === "tm" ? "Brand Name of Other Company" : "Copyright Name of Other Company";

  const rgpFilteredOptions = useMemo(() => {
    if (!row.rgpStatus) return [];
    if (row.rgpStatus === "DRAP Enlisted/Registered") return sourceItems.filter((s) => s.drapEnlisted);
    return sourceItems.filter((s) => s.status === row.rgpStatus);
  }, [row.rgpStatus, sourceItems]);

  const applyRgpBrand = (brandName) => {
    const item = sourceItems.find((s) => s.name === brandName);
    let idNo = "", date = "";
    if (item) {
      if (row.rgpStatus === "Applied") { idNo = mode === "tm" ? item.tmApplicationNo : ""; date = item.appliedDate; }
      else if (row.rgpStatus === "Advertised") { idNo = mode === "tm" ? item.tmApplicationNo : ""; date = item.advertisedDate; }
      else if (row.rgpStatus === "Certified") { idNo = mode === "tm" ? item.tmApplicationNo : ""; date = item.certifiedDate; }
      else if (row.rgpStatus === "DRAP Enlisted/Registered") { idNo = item.enlistmentRegNo || item.regNo; date = mode === "tm" ? item.enlistmentRegDate : item.regDate; }
    }
    crud.update(row.id, "rgpBrandName", brandName);
    crud.update(row.id, "rgpIdNo", idNo);
    crud.update(row.id, "rgpDate", date);
  };

  const rgpDateLabel = row.rgpStatus === "DRAP Enlisted/Registered" ? "Enlistment/Registration Date" : row.rgpStatus ? `${row.rgpStatus} Date` : "Date";

  return (
    <div style={styles.decisionCard}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div style={{ fontWeight: 700, fontSize: 14 }}>{row.rgpBrandName || row.otherBrandName || "(new record)"}</div>
        <button style={styles.iconBtnDanger} onClick={() => crud.remove(row.id)}><Trash2 size={13} /></button>
      </div>

      <div style={{ fontSize: 11, fontWeight: 700, color: "#2E6F6E", marginTop: 12, marginBottom: 4 }}>RGP Product</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
        <div><div style={{ fontSize: 10.5, color: "#9AA5B8", marginBottom: 2 }}>RGP Product Status</div>
          <select style={styles.statusSelect} value={row.rgpStatus} onChange={(e) => { crud.update(row.id, "rgpStatus", e.target.value); crud.update(row.id, "rgpBrandName", ""); crud.update(row.id, "rgpIdNo", ""); crud.update(row.id, "rgpDate", ""); }}>
            <option value="">—</option>{RGP_STATUS_OPTIONS.map((s) => <option key={s}>{s}</option>)}
          </select>
        </div>
        <div><div style={{ fontSize: 10.5, color: "#9AA5B8", marginBottom: 2 }}>{nameLabel}</div>
          <select style={styles.statusSelect} value={row.rgpBrandName} onChange={(e) => applyRgpBrand(e.target.value)} disabled={!row.rgpStatus}>
            <option value="">—</option>{rgpFilteredOptions.map((s) => <option key={s.id} value={s.name}>{s.name}</option>)}
          </select>
        </div>
        {row.rgpStatus && <LabeledMiniInput label={idLabel} value={row.rgpIdNo} onChange={(v) => crud.update(row.id, "rgpIdNo", v)} />}
        {row.rgpStatus && <LabeledMiniInput label={rgpDateLabel} type="date" value={row.rgpDate} onChange={(v) => crud.update(row.id, "rgpDate", v)} />}
        <div><div style={{ fontSize: 10.5, color: "#9AA5B8", marginBottom: 2 }}>RGP Product Marketed</div>
          <select style={styles.statusSelect} value={row.rgpMarketed} onChange={(e) => crud.update(row.id, "rgpMarketed", e.target.value)}><option value="">—</option>{MARKETED_OPTIONS.map((m) => <option key={m}>{m}</option>)}</select>
        </div>
        {row.rgpMarketed === "Yes" && <LabeledMiniInput label="Sale Percentage" value={row.rgpSalePercentage} onChange={(v) => crud.update(row.id, "rgpSalePercentage", v)} />}
        {row.rgpMarketed === "Yes" && <LabeledMiniInput label="Marketed Date" type="date" value={row.rgpMarketedDate} onChange={(v) => crud.update(row.id, "rgpMarketedDate", v)} />}
      </div>

      <div style={{ fontSize: 11, fontWeight: 700, color: "#B54834", marginTop: 16, marginBottom: 4 }}>Other Company Product</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
        <div><div style={{ fontSize: 10.5, color: "#9AA5B8", marginBottom: 2 }}>Other Company Status</div>
          <select style={styles.statusSelect} value={row.otherStatus} onChange={(e) => crud.update(row.id, "otherStatus", e.target.value)}><option value="">—</option>{RGP_STATUS_OPTIONS.map((s) => <option key={s}>{s}</option>)}</select>
        </div>
        <LabeledMiniInput label={otherNameLabel} value={row.otherBrandName} onChange={(v) => crud.update(row.id, "otherBrandName", v)} />
        {row.otherStatus === "DRAP Enlisted/Registered" && <LabeledMiniInput label="Enlistment/Registration No." value={row.otherIdNo} onChange={(v) => crud.update(row.id, "otherIdNo", v)} />}
        {row.otherStatus && <LabeledMiniInput label={row.otherStatus === "DRAP Enlisted/Registered" ? "Enlistment/Registration Date" : `${row.otherStatus} Date`} type="date" value={row.otherDate} onChange={(v) => crud.update(row.id, "otherDate", v)} />}
        <div><div style={{ fontSize: 10.5, color: "#9AA5B8", marginBottom: 2 }}>Other Company Marketed</div>
          <select style={styles.statusSelect} value={row.otherMarketed} onChange={(e) => crud.update(row.id, "otherMarketed", e.target.value)}><option value="">—</option>{MARKETED_OPTIONS.map((m) => <option key={m}>{m}</option>)}</select>
        </div>
        {row.otherMarketed === "Yes" && <LabeledMiniInput label="Sale % of RGP's Total Sale" value={row.otherSalePercentage} onChange={(v) => crud.update(row.id, "otherSalePercentage", v)} />}
        {row.otherMarketed === "Yes" && <LabeledMiniInput label="Marketed Date" type="date" value={row.otherMarketedDate} onChange={(v) => crud.update(row.id, "otherMarketedDate", v)} />}
      </div>
      {row.otherMarketed === "Yes" && row.otherSalePercentage && (
        <div style={{ fontSize: 11, color: "#B9821F", marginTop: 8, background: "#FBF1DC", padding: "6px 10px", borderRadius: 6 }}>{saleSuggestion(row.otherSalePercentage)}</div>
      )}

      <div style={{ fontSize: 11, fontWeight: 700, color: "#3A3F4B", marginTop: 16, marginBottom: 4 }}>Case Details</div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
        {showNiceClass && (
          <div><div style={{ fontSize: 10.5, color: "#9AA5B8", marginBottom: 2 }}>NICE Class</div>
            <select style={styles.statusSelect} value={row.niceClass} onChange={(e) => crud.update(row.id, "niceClass", e.target.value)}>{TM_CLASSES.map((c) => <option key={c}>{c}</option>)}</select>
          </div>
        )}
        <LabeledMiniInput label="Filed Date" type="date" value={row.filedDate} onChange={(v) => crud.update(row.id, "filedDate", v)} />
        {mode === "copyright" && <LabeledMiniInput label="Work Design" value={row.workDesign} onChange={(v) => crud.update(row.id, "workDesign", v)} />}
        <LabeledMiniInput label="Company Name" value={row.companyName} onChange={(v) => crud.update(row.id, "companyName", v)} />
        <LabeledMiniInput label="Company Address" value={row.companyAddress} onChange={(v) => crud.update(row.id, "companyAddress", v)} />
      </div>

      <div style={{ marginTop: 12 }}>
        <div style={{ fontSize: 10.5, color: "#9AA5B8", marginBottom: 4 }}>Status</div>
        <select style={{ ...styles.select, width: "100%" }} value={row.status} onChange={(e) => crud.update(row.id, "status", e.target.value)}>
          <option value="">—</option>{statusOptions.map((s) => <option key={s}>{s}</option>)}
        </select>
      </div>
    </div>
  );
}

function OppTableSection({ title, hint, rows, crud, fileRef, onExcel, importMsg, statusOptions, mode, showNiceClass, sourceItems }) {
  const [statusFilter, setStatusFilter] = useState("all");
  const filtered = rows.filter((r) => statusFilter === "all" || r.status === statusFilter);
  const idLabel = mode === "tm" ? "TM No." : "Copyright No.";
  const oppExportColumns = [
    { header: "RGP Product Status", get: (r) => r.rgpStatus }, { header: mode === "tm" ? "Brand Name of RGP" : "Copyright Name of RGP", get: (r) => r.rgpBrandName },
    { header: idLabel, get: (r) => r.rgpIdNo }, { header: "RGP Date", get: (r) => r.rgpDate },
    { header: "RGP Marketed", get: (r) => r.rgpMarketed }, { header: "RGP Sale Percentage", get: (r) => r.rgpSalePercentage }, { header: "RGP Marketed Date", get: (r) => r.rgpMarketedDate },
    { header: "Other Company Status", get: (r) => r.otherStatus }, { header: mode === "tm" ? "Brand Name of Other Company" : "Copyright Name of Other Company", get: (r) => r.otherBrandName },
    { header: "Other Company Number", get: (r) => r.otherIdNo }, { header: "Other Company Date", get: (r) => r.otherDate },
    { header: "Other Company Marketed", get: (r) => r.otherMarketed }, { header: "Other Company Sale % of RGP Total", get: (r) => r.otherSalePercentage }, { header: "Other Company Marketed Date", get: (r) => r.otherMarketedDate },
    ...(showNiceClass ? [{ header: "NICE Class", get: (r) => r.niceClass }] : []),
    { header: "Filed Date", get: (r) => r.filedDate },
    ...(mode === "copyright" ? [{ header: "Work Design", get: (r) => r.workDesign }] : []),
    { header: "Company Name", get: (r) => r.companyName }, { header: "Company Address", get: (r) => r.companyAddress },
    { header: "Status", get: (r) => r.status },
  ];
  return (
    <section style={styles.card}>
      <div style={styles.cardTitle}>{title}</div>
      <ExcelUploadRow fileInputRef={fileRef} onExcel={onExcel} importMsg={importMsg} hint={hint}
        exportRows={rows} exportColumns={oppExportColumns} exportName={title.toLowerCase().replace(/\s+/g, "-") + ".xlsx"} />
      <div style={{ marginBottom: 14 }}>
        <button style={styles.addBtn} onClick={() => crud.add(crud.blank)}><Plus size={16} /> Add New Record</button>
      </div>
      <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 16 }}>
        <FilterPill active={statusFilter === "all"} onClick={() => setStatusFilter("all")} label="All" />
        {statusOptions.map((s) => <FilterPill key={s} active={statusFilter === s} onClick={() => setStatusFilter(s)} label={s} />)}
      </div>
      {filtered.length === 0 ? <EmptyState text="No records yet — click 'Add New Record' above." /> : filtered.map((r) => (
        <OppRecordCard key={r.id} row={r} crud={crud} mode={mode} statusOptions={statusOptions} showNiceClass={showNiceClass} sourceItems={sourceItems} />
      ))}
    </section>
  );
}

function TmOppositionTab({ oppByRgp, oppByRgpCrud, oppByRgpFileRef, onOppByRgpExcel, oppByRgpImportMsg,
  oppAgainstRgp, oppAgainstRgpCrud, oppAgainstRgpFileRef, onOppAgainstRgpExcel, oppAgainstRgpImportMsg,
  decisionToOpposeTm, decisionTmCrud, trademarks }) {
  const [subTab, setSubTab] = useState("by");
  const [caseFilter, setCaseFilter] = useState("all");
  const filteredDecisions = decisionToOpposeTm.filter((d) => caseFilter === "all" || d.caseStatus === caseFilter);

  return (
    <div>
      <TabHeader eyebrow="TM OPPOSITION" title="Trademark Opposition" action={
        <GenerateReportButton onClick={() => openReportWindow("TM Opposition Report", `
          ${dataTable("TM Opposition — By RGP", oppByRgp, [
            { header: "Complaint By", get: (r) => r.companyName }, { header: "RGP Brand", get: (r) => r.rgpBrandName }, { header: "RGP TM No.", get: (r) => r.rgpIdNo },
            { header: "Other Company", get: (r) => r.otherBrandName }, { header: "Nice Class", get: (r) => r.niceClass }, { header: "Filed Date", get: (r) => r.filedDate }, { header: "Status", get: (r) => r.status },
          ])}
          ${dataTable("TM Opposition — Against RGP", oppAgainstRgp, [
            { header: "Company", get: (r) => r.companyName }, { header: "RGP Brand", get: (r) => r.rgpBrandName }, { header: "RGP TM No.", get: (r) => r.rgpIdNo },
            { header: "Other Brand", get: (r) => r.otherBrandName }, { header: "Nice Class", get: (r) => r.niceClass }, { header: "Filed Date", get: (r) => r.filedDate }, { header: "Status", get: (r) => r.status },
          ])}
          ${dataTable("Decision to Oppose — TM", decisionToOpposeTm, [
            { header: "Complaint #", get: (r) => r.complaintNo }, { header: "Company", get: (r) => r.companyName }, { header: "Nature", get: (r) => r.nature },
            { header: "Marketed", get: (r) => r.marketed }, { header: "Sale %", get: (r) => r.salePercentage }, { header: "Decision", get: (r) => (r.decision || []).join(", ") },
            { header: "Case Status", get: (r) => r.caseStatus }, { header: "Action Taken", get: (r) => r.actionTaken },
          ])}
        `)} />
      } />
      <div style={{ display: "flex", gap: 8, marginBottom: 18, flexWrap: "wrap" }}>
        <FilterPill active={subTab === "by"} onClick={() => setSubTab("by")} label="Opposition by RGP" />
        <FilterPill active={subTab === "against"} onClick={() => setSubTab("against")} label="Opposition Against RGP" />
        <FilterPill active={subTab === "decision"} onClick={() => setSubTab("decision")} label="Decision to Oppose TM" />

function ChangeCredentialsPanel() {
  const [creds, setCreds] = useState(null);
  const [newId, setNewId] = useState("");
  const [newPw, setNewPw] = useState("");
  const [msg, setMsg] = useState("");

  useEffect(() => {
    storage.get(SIMPLE_AUTH_KEY).then((r) => {
      if (r && r.value) { try { setCreds(JSON.parse(r.value)); return; } catch (e) {} }
      setCreds({ id: "RGP", password: "rgp" });
    });
  }, []);

  const save = async () => {
    if (!newId.trim() || !newPw.trim()) { setMsg("Both fields are required."); return; }
    const updated = { id: newId.trim(), password: newPw };
    await storage.set(SIMPLE_AUTH_KEY, JSON.stringify(updated));
    setCreds(updated); setNewId(""); setNewPw("");
    setMsg("Login ID and password updated.");
  };

  if (!creds) return null;
  return (
    <section style={styles.card}>
      <div style={styles.cardTitle}>Change Dashboard Login</div>
      <div style={styles.cardSub}>Current Login ID: <b>{creds.id}</b>. Set a new ID and password below — takes effect next time someone signs in.</div>
      <div style={styles.inputRow}>
        <input style={styles.input} placeholder="New Login ID" value={newId} onChange={(e) => setNewId(e.target.value)} />
        <input style={styles.input} placeholder="New Password" value={newPw} onChange={(e) => setNewPw(e.target.value)} />
        <button style={styles.addBtn} onClick={save}>Save</button>
      </div>
      {msg && <div style={styles.importMsg}>{msg}</div>}
    </section>
  );
}

function StagePill({ stage }) {
  const colors = { Monitor: { bg: "#EAF3F2", fg: "#2E6F6E" }, "Cease & Desist": { bg: "#FBF1DC", fg: "#B9821F" }, "DRAP Complaint": { bg: "#F2E7DE", fg: "#A85C2E" }, "TM Opposition": { bg: "#F7E5E1", fg: "#B54834" } };

// =============== SIMPLE LOGIN GATE (always shown, works with or without Firebase) ===============
const SIMPLE_AUTH_KEY = "rgp:simpleAuth";
function SimpleLoginGate({ children }) {
  const [unlocked, setUnlocked] = useState(() => sessionStorage.getItem("rgp_simple_unlocked") === "true");
  const [creds, setCreds] = useState(null);
  const [idInput, setIdInput] = useState("");
  const [pwInput, setPwInput] = useState("");
  const [error, setError] = useState("");

  useEffect(() => {
    storage.get(SIMPLE_AUTH_KEY).then((r) => {
      if (r && r.value) { try { setCreds(JSON.parse(r.value)); return; } catch (e) {} }
      setCreds({ id: "RGP", password: "rgp" });
    });
  }, []);

  if (unlocked) return children;
  if (creds === null) return null;

  const handleSubmit = (e) => {
    e.preventDefault();
    if (idInput.trim() === creds.id && pwInput === creds.password) {
      sessionStorage.setItem("rgp_simple_unlocked", "true");
      setUnlocked(true);
    } else {
      setError("Incorrect ID or password.");
    }
  };

  return (
    <div style={styles.loginPage}>
      <style>{fontImport}</style>
      <form style={styles.loginCard} onSubmit={handleSubmit}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
          <Shield size={22} color="#D9A441" /><span style={{ ...styles.brandText, color: "#1B2A4A" }}>RG Pharmaceutica</span>
        </div>
        <div style={{ fontSize: 12.5, color: "#6B7280", marginBottom: 22 }}>Enter the dashboard access ID and password</div>
        <input style={{ ...styles.input, width: "100%" }} placeholder="Login ID" value={idInput} onChange={(e) => setIdInput(e.target.value)} required autoFocus />
        <div style={{ height: 10 }} />
        <input style={{ ...styles.input, width: "100%" }} type="password" placeholder="Password" value={pwInput} onChange={(e) => setPwInput(e.target.value)} required />
        {error && <div style={{ color: "#B54834", fontSize: 12.5, marginTop: 10 }}>{error}</div>}
        <button style={{ ...styles.addBtn, width: "100%", justifyContent: "center", marginTop: 16 }} type="submit">Enter</button>
      </form>
    </div>
  );
}

// =============== FIREBASE AUTH GATE ===============
function AuthGate() {
  const [user, setUser] = useState(undefined);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    if (!FIREBASE_ENABLED) { setUser(null); return; }
    const unsub = fbAuth.onAuthStateChanged((u) => setUser(u || null));
    return () => unsub();
  }, []);

  if (!FIREBASE_ENABLED) return <BrandShieldDashboard user={null} />;
  if (user === undefined) return null;
  if (user) return <BrandShieldDashboard user={user} onLogout={() => fbAuth.signOut()} />;

  const handleLogin = (e) => {
    e.preventDefault();
    setError(""); setBusy(true);
    fbAuth.signInWithEmailAndPassword(email.trim(), password)
      .catch((err) => setError(err.code === "auth/invalid-credential" || err.code === "auth/wrong-password" || err.code === "auth/user-not-found"
        ? "Incorrect email or password." : "Sign-in failed: " + err.message))
      .finally(() => setBusy(false));
  };

  return (
    <div style={styles.loginPage}>
      <style>{fontImport}</style>
      <form style={styles.loginCard} onSubmit={handleLogin}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
          <Shield size={22} color="#D9A441" /><span style={{ ...styles.brandText, color: "#1B2A4A" }}>RG Pharmaceutica</span>
        </div>
        <div style={{ fontSize: 12.5, color: "#6B7280", marginBottom: 22 }}>Sign in to the Trademark &amp; Brand Management Dashboard</div>
        <input style={{ ...styles.input, width: "100%" }} type="email" placeholder="you@rgpharma.com" value={email} onChange={(e) => setEmail(e.target.value)} required autoFocus />
        <div style={{ height: 10 }} />
        <input style={{ ...styles.input, width: "100%" }} type="password" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} required />
        {error && <div style={{ color: "#B54834", fontSize: 12.5, marginTop: 10 }}>{error}</div>}
        <button style={{ ...styles.addBtn, width: "100%", justifyContent: "center", marginTop: 16 }} disabled={busy} type="submit">{busy ? "Signing in..." : "Sign In"}</button>
        <div style={{ fontSize: 11, color: "#9AA5B8", marginTop: 16, lineHeight: 1.5 }}>Don't have an account? Ask your Regulatory Affairs Manager to create one for you in the Firebase console.</div>
      </form>
    </div>
  );
}

function App() { return <SimpleLoginGate><AuthGate /></SimpleLoginGate>; }

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
