<script type="text/babel">
const { useState, useEffect, useRef } = React;

function IconBase({ children, size = 16, color, style }) {
  return <span style={{ fontSize: size, lineHeight: 1, color, display: "inline-flex", ...style }}>{children}</span>;
}
const Shield = (p) => <IconBase {...p}>🛡️</IconBase>;
const ImageIcon = (p) => <IconBase {...p}>🖼️</IconBase>;
const X = (p) => <IconBase {...p}>✕</IconBase>;
const Check = (p) => <IconBase {...p}>✅</IconBase>;
const Send = (p) => <IconBase {...p}>📨</IconBase>;

// ---------- Same Firebase project as the main dashboard ----------
const firebaseConfig = {
  apiKey: "AIzaSyDrArTOOUyuLr8pyuglQngk-XG5pywK80o",
  authDomain: "rgp-trademark-dashboard.firebaseapp.com",
  projectId: "rgp-trademark-dashboard",
  storageBucket: "rgp-trademark-dashboard.firebasestorage.app",
  messagingSenderId: "344112634235",
  appId: "1:344112634235:web:9c9d4c347638ebc22b45de",
};
const FIREBASE_ENABLED = firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf("PASTE_YOUR") !== 0;
let fbApp = null, fbAuth = null, fbDb = null;
if (FIREBASE_ENABLED) {
  fbApp = firebase.initializeApp(firebaseConfig);
  fbAuth = firebase.auth();
  fbDb = firebase.firestore();
}
// Sign in anonymously so Firestore security rules that require a logged-in
// request (request.auth != null) still let this form read/write. Every
// caller below awaits this before touching Firestore.
const authReady = FIREBASE_ENABLED
  ? new Promise((resolve) => {
      fbAuth.onAuthStateChanged((u) => { if (u) resolve(u); });
      fbAuth.signInAnonymously().catch((err) => { console.error("Anonymous sign-in failed", err); resolve(null); });
    })
  : Promise.resolve(null);
const FIRESTORE_COLLECTION = "rgpDashboardData";
// Same document key the main dashboard listens to for its Complaint Log.
const COMPLAINTS_KEY = "rgp:complaints";
const TRADEMARKS_KEY = "rgp:trademarks";
// This form's OWN login — separate from the main dashboard's ID/password, so marketing
// only gets access to submit complaints, not the full dashboard.
const SIMPLE_AUTH_KEY = "rgp:complaintPortalAuth";
const DEFAULT_CREDS = { id: "RGP-Marketing", password: "marketing2026" };

async function getAuthCreds() {
  if (FIREBASE_ENABLED && fbDb) {
    try {
      await authReady;
      const doc = await fbDb.collection(FIRESTORE_COLLECTION).doc(SIMPLE_AUTH_KEY).get();
      if (doc.exists && doc.data().value) return JSON.parse(doc.data().value);
    } catch (e) {}
  }
  return DEFAULT_CREDS;
}
async function setAuthCreds(creds) {
  if (FIREBASE_ENABLED && fbDb) {
    try {
      await authReady;
      await fbDb.collection(FIRESTORE_COLLECTION).doc(SIMPLE_AUTH_KEY).set({
        value: JSON.stringify(creds), updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      });
    } catch (e) { console.error("Could not save new credentials", e); }
  }
}

function uid(prefix) { return `${prefix}_${Date.now()}_${Math.floor(Math.random() * 100000)}`; }
function today() { return new Date().toISOString().slice(0, 10); }
function saleSuggestion(pct) {
  const n = parseFloat(pct);
  if (isNaN(n)) return "";
  if (n < 2) return "Likely track: Monitor + File DRAP QA + Lawyer Notice (< 2% market share)";
  if (n <= 5) return "Likely track: Lawyer Notice + File DRAP QA, watch closely (2–5% market share)";
  return "Likely track: Full Oppose — Lawyer + DRAP Registration & HOTC Division (> 5% market share)";
}
function fileToCompressedDataUrl(file, maxDim = 700, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new window.Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) { height = Math.round((height * maxDim) / width); width = maxDim; }
        else if (height > maxDim) { width = Math.round((width * maxDim) / height); height = maxDim; }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject; img.src = e.target.result;
    };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

// Appends one complaint to the same array the dashboard reads/writes, using a
// transaction so a submission here never clobbers what the dashboard team is doing.
async function appendComplaint(entry) {
  if (!FIREBASE_ENABLED || !fbDb) throw new Error("Firebase is not configured.");
  await authReady;
  const docRef = fbDb.collection(FIRESTORE_COLLECTION).doc(COMPLAINTS_KEY);
  await fbDb.runTransaction(async (tx) => {
    const snap = await tx.get(docRef);
    let arr = [];
    if (snap.exists && snap.data().value) {
      try { arr = JSON.parse(snap.data().value); } catch (e) { arr = []; }
    }
    arr = [entry, ...arr];
    const payload = JSON.stringify(arr);
    // Firestore caps a single document at ~1MB. All complaints (including photos as
    // base64 text) live in one document, so a large photo can push it over the limit.
    if (payload.length > 900000) {
      throw new Error("The complaint log is close to Firestore's 1MB document size limit — try submitting with fewer or smaller photos, or ask an admin to archive old complaints.");
    }
    tx.set(docRef, {
      value: payload,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedBy: "Public Complaint Portal",
    });
  });
}

async function fetchNameLists() {
  if (!FIREBASE_ENABLED || !fbDb) return { enlisted: [], certified: [], error: null };
  try {
    await authReady;
    const snap = await fbDb.collection(FIRESTORE_COLLECTION).doc(TRADEMARKS_KEY).get();
    if (!snap.exists || !snap.data().value) return { enlisted: [], certified: [], error: null };
    const arr = JSON.parse(snap.data().value);
    return {
      enlisted: arr.filter((t) => t.drapEnlisted).map((t) => t.name).filter(Boolean),
      certified: arr.filter((t) => t.status === "Certified").map((t) => t.name).filter(Boolean),
      error: null,
    };
  } catch (e) {
    console.error("Could not load trademark list", e);
    return { enlisted: [], certified: [], error: e.message || "Could not load trademark list." };
  }
}

const FILED_BY_OPTIONS = ["Public Portal", "Field Force", "Lawyer", "Regulatory (DRAP)", "Management"];
const SIMILARITY_ISSUES = ["Trademark", "Copyright", "Other"];
const MARKETED_OPTIONS = ["Yes", "No"];

const BLANK_FORM = {
  text: "", filedBy: "Public Portal", reporterName: "", reporterContact: "",
  companyName: "", companyAddress: "", productName: "", marketed: "", salePercentage: "",
  similarityIssue: "Trademark", enlistmentRegNo: "", similarTo: "", certifiedMark: "", images: [],
};

function ComplaintForm() {
  const [form, setForm] = useState(BLANK_FORM);
  const [enlistedNames, setEnlistedNames] = useState([]);
  const [certifiedNames, setCertifiedNames] = useState([]);
  const [nameListError, setNameListError] = useState(null);
  const [nameListLoading, setNameListLoading] = useState(true);
  const [submitting, setSubmitting] = useState(false);
  const [error, setError] = useState("");
  const [refId, setRefId] = useState(null);
  const imagesRef = useRef(null);

  const loadNameLists = () => {
    setNameListLoading(true);
    fetchNameLists().then(({ enlisted, certified, error }) => {
      setEnlistedNames(enlisted); setCertifiedNames(certified); setNameListError(error); setNameListLoading(false);
    });
  };
  useEffect(() => { loadNameLists(); }, []);

  const set = (patch) => setForm((prev) => ({ ...prev, ...patch }));

  const handleImages = async (e) => {
    const files = Array.from(e.target.files || []);
    if (!files.length) return;
    const dataUrls = await Promise.all(files.map((f) => fileToCompressedDataUrl(f)));
    set({ images: [...form.images, ...dataUrls].slice(0, 8) });
    e.target.value = "";
  };
  const removeImage = (idx) => set({ images: form.images.filter((_, i) => i !== idx) });

  const canSubmit = form.text.trim().length > 0 && !submitting;

  const submit = async () => {
    if (!canSubmit) return;
    setSubmitting(true); setError("");
    const composedText = [
      form.reporterName || form.reporterContact
        ? `Reported by: ${form.reporterName || "—"}${form.reporterContact ? " (" + form.reporterContact + ")" : ""}`
        : null,
      form.text.trim(),
    ].filter(Boolean).join("\n");

    const entry = {
      id: uid("cp"), sheetId: null, portalId: uid("portal"),
      date: today(), resolved: false, resolvedDate: "",
      text: composedText, filedBy: form.filedBy,
      reporterName: form.reporterName, reporterContact: form.reporterContact,
      companyName: form.companyName, companyAddress: form.companyAddress, productName: form.productName,
      marketed: form.marketed, salePercentage: form.marketed === "Yes" ? form.salePercentage : "",
      similarityIssue: form.similarityIssue, enlistmentRegNo: form.enlistmentRegNo,
      similarTo: form.similarTo, certifiedMark: form.certifiedMark, images: form.images,
    };
    try {
      await appendComplaint(entry);
      setRefId(entry.id.slice(-6).toUpperCase());
      setForm(BLANK_FORM);
    } catch (e) {
      console.error(e);
      const code = e && e.code ? ` (${e.code})` : "";
      setError(`Could not submit${code}: ${e && e.message ? e.message : "unknown error"}`);
    }
    setSubmitting(false);
  };

  if (refId) {
    return (
      <div style={s.page}>
        <style>{fontImport}</style>
        <div style={s.card}>
          <div style={{ display: "flex", justifyContent: "center", marginBottom: 10 }}><Check size={32} /></div>
          <div style={{ ...s.brandTitle, textAlign: "center" }}>Complaint received</div>
          <div style={{ textAlign: "center", color: "#6B7280", fontSize: 13.5, marginTop: 8, lineHeight: 1.6 }}>
            Thank you — this has been logged directly into RG Pharmaceutica's Complaint Log.
            {form.similarityIssue !== "Other" ? " Trademark and copyright issues are automatically escalated for review." : ""}
          </div>
          <div style={{ textAlign: "center", marginTop: 18 }}>
            <div style={{ fontSize: 11, color: "#9AA5B8", textTransform: "uppercase", letterSpacing: 0.5 }}>Reference ID</div>
            <div style={{ fontFamily: "'IBM Plex Mono', monospace", fontSize: 18, fontWeight: 600, color: "#1B2A4A", marginTop: 4 }}>{refId}</div>
          </div>
          <button style={{ ...s.primaryBtn, width: "100%", justifyContent: "center", marginTop: 24 }} onClick={() => setRefId(null)}>Submit another complaint</button>
          <ChangeCredentialsPanel />
        </div>
      </div>
    );
  }

  return (
    <div style={s.page}>
      <style>{fontImport}</style>
      <div style={s.card}>
        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
          <Shield size={22} color="#D9A441" /><span style={s.brandText}>RG Pharmaceutica</span>
        </div>
        <div style={s.brandTitle}>Report a Brand / Trademark Complaint</div>
        <div style={{ fontSize: 13, color: "#6B7280", marginTop: 6, marginBottom: 22, lineHeight: 1.6 }}>
          Use this form to flag a product, packaging, or brand name that looks similar to one of RG Pharmaceutica's
          trademarks or copyrighted designs. Submissions go straight into the internal Complaint Log.
        </div>

        {!FIREBASE_ENABLED && (
          <div style={s.warningBanner}>This form isn't connected to Firebase yet — submissions won't be saved.</div>
        )}

        <Field label="What did you notice? *">
          <textarea style={s.textarea} placeholder="Describe the similar product, packaging, or brand name you came across..."
            value={form.text} onChange={(e) => set({ text: e.target.value })} />
        </Field>

        <Row>
          <Field label="Filed by" style={{ flex: 1 }}>
            <select style={s.select} value={form.filedBy} onChange={(e) => set({ filedBy: e.target.value })}>
              {FILED_BY_OPTIONS.map((o) => <option key={o}>{o}</option>)}
            </select>
          </Field>
          <Field label="Your name (optional)" style={{ flex: 1 }}>
            <input style={s.input} value={form.reporterName} onChange={(e) => set({ reporterName: e.target.value })} placeholder="e.g. Ahmed Khan" />
          </Field>
          <Field label="Your phone / email (optional)" style={{ flex: 1 }}>
            <input style={s.input} value={form.reporterContact} onChange={(e) => set({ reporterContact: e.target.value })} placeholder="For follow-up" />
          </Field>
        </Row>

        <Row>
          <Field label="Company name" style={{ flex: 1 }}>
            <input style={s.input} value={form.companyName} onChange={(e) => set({ companyName: e.target.value })} placeholder="Company selling the product" />
          </Field>
          <Field label="Company address" style={{ flex: 1 }}>
            <input style={s.input} value={form.companyAddress} onChange={(e) => set({ companyAddress: e.target.value })} />
          </Field>
        </Row>

        <Row>
          <Field label="Product name" style={{ flex: 1 }}>
            <input style={s.input} value={form.productName} onChange={(e) => set({ productName: e.target.value })} />
          </Field>
          <Field label="Marketed?" style={{ width: 140 }}>
            <select style={s.select} value={form.marketed}
              onChange={(e) => set({ marketed: e.target.value, salePercentage: e.target.value === "No" ? "" : form.salePercentage })}>
              <option value="">Not sure</option>{MARKETED_OPTIONS.map((m) => <option key={m}>{m}</option>)}
            </select>
          </Field>
          {form.marketed === "Yes" && (
            <Field label="Approx. market share %" style={{ width: 180 }}>
              <input style={s.input} value={form.salePercentage} onChange={(e) => set({ salePercentage: e.target.value })} placeholder="e.g. 3" />
            </Field>
          )}
        </Row>
        {form.marketed === "Yes" && form.salePercentage && (
          <div style={{ fontSize: 11.5, color: "#B9821F", background: "#FBF1DC", padding: "6px 10px", borderRadius: 6, marginBottom: 14 }}>
            {saleSuggestion(form.salePercentage)}
          </div>
        )}

        <Row>
          <Field label="Similarity issue" style={{ flex: 1 }}>
            <select style={s.select} value={form.similarityIssue} onChange={(e) => set({ similarityIssue: e.target.value })}>
              {SIMILARITY_ISSUES.map((s2) => <option key={s2}>{s2}</option>)}
            </select>
          </Field>
          <Field label="Enlistment / Registration No. (if known)" style={{ flex: 1 }}>
            <input style={s.input} value={form.enlistmentRegNo} onChange={(e) => set({ enlistmentRegNo: e.target.value })} />
          </Field>
        </Row>

        <Row>
          <Field label="Similar to which RGP product?" style={{ flex: 1 }}>
            <input style={s.input} list="enlisted-names-list" value={form.similarTo} onChange={(e) => set({ similarTo: e.target.value })}
              placeholder="Type or pick a DRAP-enlisted / registered RGP product" />
            <datalist id="enlisted-names-list">{enlistedNames.map((n) => <option key={n} value={n} />)}</datalist>
          </Field>
          <Field label="Certified mark (if applicable)" style={{ flex: 1 }}>
            <input style={s.input} list="certified-names-list" value={form.certifiedMark} onChange={(e) => set({ certifiedMark: e.target.value })}
              placeholder="Type or pick a certified RGP trademark" />
            <datalist id="certified-names-list">{certifiedNames.map((n) => <option key={n} value={n} />)}</datalist>
          </Field>
        </Row>
        <div style={{ fontSize: 11, color: nameListError ? "#B54834" : "#9AA5B8", marginTop: -6, marginBottom: 14 }}>
          {nameListLoading ? "Loading trademark list..." : nameListError
            ? `Could not load trademark list (${nameListError}).`
            : `${enlistedNames.length} enlisted product(s), ${certifiedNames.length} certified mark(s) loaded from TM Portfolio.`}
          {" "}<button type="button" onClick={loadNameLists} style={{ background: "none", border: "none", color: "#2E6F6E", cursor: "pointer", fontSize: 11, textDecoration: "underline", padding: 0 }}>Refresh list</button>
        </div>

        <Field label="Photo evidence (optional, up to 8)">
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            {form.images.map((img, i) => (
              <div key={i} style={{ position: "relative" }}>
                <img src={img} alt="evidence" style={s.thumbSmall} />
                <button style={s.thumbRemove} onClick={() => removeImage(i)}><X size={11} /></button>
              </div>
            ))}
            <button style={s.imageUploadBtn} onClick={() => imagesRef.current.click()} type="button"><ImageIcon size={16} color="#6B7280" /><span>Add photo(s)</span></button>
            <input type="file" accept="image/*" multiple ref={imagesRef} style={{ display: "none" }} onChange={handleImages} />
          </div>
        </Field>

        {error && <div style={{ color: "#B54834", fontSize: 12.5, marginTop: 4, marginBottom: 8 }}>{error}</div>}

        <button style={{ ...s.primaryBtn, width: "100%", justifyContent: "center", marginTop: 8, opacity: canSubmit ? 1 : 0.55 }} disabled={!canSubmit} onClick={submit}>
          <Send size={15} /> {submitting ? "Submitting..." : "Submit Complaint"}
        </button>
        {(form.similarityIssue === "Trademark" || form.similarityIssue === "Copyright") && (
          <div style={{ fontSize: 11, color: "#2E6F6E", marginTop: 10, textAlign: "center" }}>
            → Will be auto-added to {form.similarityIssue === "Trademark" ? "Decision to Oppose TM" : "Decision to Oppose Copyright"} once logged.
          </div>
        )}
        <ChangeCredentialsPanel />
      </div>
    </div>
  );
}

function Row({ children }) { return <div style={{ display: "flex", gap: 12, marginBottom: 14, flexWrap: "wrap" }}>{children}</div>; }
function Field({ label, style, children }) {
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 5, marginBottom: 14, ...style }}>
      <label style={{ fontSize: 11.5, color: "#6B7280", fontWeight: 600 }}>{label}</label>
      {children}
    </div>
  );
}

const fontImport = `@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');`;

const s = {
  page: { minHeight: "100vh", display: "flex", alignItems: "flex-start", justifyContent: "center", background: "#F7F5F0", fontFamily: "'Inter', system-ui, sans-serif", padding: "48px 16px" },
  card: { width: "100%", maxWidth: 620, background: "#fff", borderRadius: 16, padding: "32px 34px", boxShadow: "0 1px 2px rgba(20,20,30,0.06), 0 8px 24px rgba(20,20,30,0.05)" },
  brandText: { fontFamily: "'Fraunces', serif", fontSize: 15, fontWeight: 600, letterSpacing: 0.2, color: "#1B2A4A" },
  brandTitle: { fontFamily: "'Fraunces', serif", fontSize: 22, fontWeight: 600, color: "#1B2A4A", marginTop: 12 },
  input: { padding: "10px 12px", borderRadius: 8, border: "1px solid #E1E4EA", fontSize: 13.5, outline: "none", fontFamily: "inherit", width: "100%" },
  select: { padding: "10px 12px", borderRadius: 8, border: "1px solid #E1E4EA", fontSize: 13.5, fontFamily: "inherit", width: "100%" },
  textarea: { width: "100%", minHeight: 80, padding: "10px 12px", borderRadius: 8, border: "1px solid #E1E4EA", fontSize: 13.5, outline: "none", fontFamily: "inherit", resize: "vertical" },
  primaryBtn: { display: "flex", alignItems: "center", gap: 6, background: "#1B2A4A", color: "#fff", border: "none", borderRadius: 8, padding: "12px 18px", fontSize: 13.5, fontWeight: 600, cursor: "pointer" },
  imageUploadBtn: { display: "flex", flexDirection: "column", alignItems: "center", gap: 4, width: 100, height: 70, borderRadius: 8, border: "1.5px dashed #D8DCE3", background: "#FAFAF8", cursor: "pointer", fontSize: 11, color: "#6B7280" },
  thumbSmall: { width: 100, height: 70, objectFit: "cover", borderRadius: 8, border: "1px solid #EEF0F3" },
  thumbRemove: { position: "absolute", top: -6, right: -6, width: 18, height: 18, borderRadius: "50%", background: "#B54834", color: "#fff", border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" },
  warningBanner: { background: "#FBF1DC", border: "1px solid #F0DDA8", borderRadius: 10, padding: "10px 14px", marginBottom: 16, fontSize: 12.5, color: "#5C4517" },
};

// =============== LOGIN GATE (own ID/password, stored in the same Firebase project) ===============
function SimpleLoginGate({ children }) {
  const [unlocked, setUnlocked] = useState(() => sessionStorage.getItem("rgp_complaint_unlocked") === "true");
  const [creds, setCreds] = useState(null);
  const [idInput, setIdInput] = useState("");
  const [pwInput, setPwInput] = useState("");
  const [error, setError] = useState("");

  useEffect(() => { getAuthCreds().then(setCreds); }, []);

  if (unlocked) return children;
  if (creds === null) return null;

  const handleSubmit = (e) => {
    e.preventDefault();
    if (idInput.trim() === creds.id && pwInput === creds.password) {
      sessionStorage.setItem("rgp_complaint_unlocked", "true");
      setUnlocked(true);
    } else {
      setError("Incorrect ID or password.");
    }
  };

  return (
    <div style={s.page}>
      <style>{fontImport}</style>
      <div style={{ ...s.card, maxWidth: 380 }}>
        <form onSubmit={handleSubmit}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 4 }}>
            <Shield size={22} color="#D9A441" /><span style={s.brandText}>RG Pharmaceutica</span>
          </div>
          <div style={{ fontSize: 12.5, color: "#6B7280", margin: "6px 0 22px" }}>Sign in to the Complaint Portal</div>
          <input style={{ ...s.input, marginBottom: 10 }} placeholder="Login ID" value={idInput} onChange={(e) => setIdInput(e.target.value)} required autoFocus />
          <input style={s.input} type="password" placeholder="Password" value={pwInput} onChange={(e) => setPwInput(e.target.value)} required />
          {error && <div style={{ color: "#B54834", fontSize: 12.5, marginTop: 10 }}>{error}</div>}
          <button style={{ ...s.primaryBtn, width: "100%", justifyContent: "center", marginTop: 16 }} type="submit">Enter</button>
        </form>
      </div>
    </div>
  );
}

// =============== CHANGE LOGIN ID / PASSWORD (shown at the bottom once signed in) ===============
function ChangeCredentialsPanel() {
  const [open, setOpen] = useState(false);
  const [creds, setCreds] = useState(null);
  const [newId, setNewId] = useState("");
  const [newPw, setNewPw] = useState("");
  const [msg, setMsg] = useState("");

  useEffect(() => { getAuthCreds().then(setCreds); }, []);

  const save = async (e) => {
    e.preventDefault();
    const next = { id: newId.trim() || creds.id, password: newPw || creds.password };
    await setAuthCreds(next);
    setCreds(next); setNewId(""); setNewPw(""); setMsg("Saved. Use the new details next time you sign in.");
  };

  if (!open) return (
    <div style={{ textAlign: "center", marginTop: 18 }}>
      <button onClick={() => setOpen(true)} style={{ background: "none", border: "none", color: "#9AA5B8", fontSize: 11.5, cursor: "pointer", textDecoration: "underline" }}>
        Change login ID / password
      </button>
    </div>
  );
  return (
    <div style={{ marginTop: 18, borderTop: "1px solid #EEF0F3", paddingTop: 16 }}>
      <div style={{ fontSize: 12.5, fontWeight: 600, color: "#3A3F4B", marginBottom: 8 }}>Change login ID / password</div>
      <form onSubmit={save}>
        <input style={{ ...s.input, marginBottom: 8 }} placeholder={`New ID (current: ${creds ? creds.id : "..."})`} value={newId} onChange={(e) => setNewId(e.target.value)} />
        <input style={{ ...s.input, marginBottom: 8 }} type="password" placeholder="New password" value={newPw} onChange={(e) => setNewPw(e.target.value)} />
        {msg && <div style={{ fontSize: 11.5, color: "#2E6F6E", marginBottom: 8 }}>{msg}</div>}
        <div style={{ display: "flex", gap: 8 }}>
          <button type="submit" style={{ ...s.primaryBtn, fontSize: 12 }}>Save</button>
          <button type="button" onClick={() => setOpen(false)} style={{ background: "none", border: "1px solid #E1E4EA", borderRadius: 8, padding: "10px 14px", fontSize: 12, cursor: "pointer" }}>Close</button>
        </div>
      </form>
    </div>
  );
}

function App() { return <SimpleLoginGate><ComplaintForm /></SimpleLoginGate>; }

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
